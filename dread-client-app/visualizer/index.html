<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dread Visualizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div>
          <p class="brand">Metroid Bread</p>
          <h1>Visualizer</h1>
        </div>
        <div class="meta">
          <span id="conn" data-state="off">AP offline</span>
          <span id="slot-label">—</span>
          <span id="counts">0 / 0 checks</span>
          <span id="spot-count">0 cells</span>
        </div>
      </header>

      <div class="region-tabs" id="region-tabs"></div>
      <p class="legend muted">
        <span class="legend-dot terrain"></span> Terrain
        · <span class="legend-dot heat"></span> Heat
        · <span class="legend-dot water"></span> Water
        · <span class="legend-dot emmi"></span> EMMI
        · <span class="legend-dot magnet"></span> Magnet
        · <span class="legend-dot door"></span> Door
        · <span class="legend-dot save"></span> Save
        · <span class="legend-dot mapst"></span> Map
        · <span class="legend-dot energy"></span> Energy / Ammo
        · <span class="legend-dot elevator"></span> Elevator / Tram
        · <span class="legend-dot teleport"></span> Teleport
        · <span class="legend-dot nav"></span> Nav
        · <span class="legend-dot cu"></span> CU / Boss
        · <span class="legend-dot room"></span> Camera
        · <span class="legend-dot spot"></span> In-logic floor
        · <span class="legend-dot unchecked"></span> Out of logic
        · <span class="legend-dot in-logic"></span> In logic
        · <span class="legend-dot checked"></span> Checked
        · Drag to pan, wheel to zoom
      </p>

      <main class="map-pane" id="map-pane">
        <svg id="world-map" xmlns="http://www.w3.org/2000/svg" aria-label="Dread world map"></svg>
      </main>
      <div id="tooltip" class="tooltip" hidden></div>
      <aside id="explain-panel" class="explain-panel" hidden>
        <header class="explain-head">
          <div>
            <p class="explain-kicker">Check logic</p>
            <h2 id="explain-title">Check</h2>
          </div>
          <button type="button" id="explain-close" aria-label="Close">×</button>
        </header>
        <div id="explain-body" class="explain-body"></div>
      </aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
